# Deployed with kamal to a single server, which does everything: serves the
# site, runs the scrape, and keeps the pictures.
#
#   bin/kamal setup     first time -- installs docker, boots postgres, deploys
#   bin/kamal deploy    every time after that
#   bin/kamal rollback  back to the previous version
#
# Nothing personal is written down here. The four things that are yours come
# out of the environment, so this file is the same for everybody:
#
#   DEPLOY_HOST        the server, by address or hostname
#   DEPLOY_DOMAIN      what the site answers to, for the TLS certificate
#   DEPLOY_REGISTRY    where the built image is pushed (Docker Hub, ghcr.io,
#                      a cloud provider's registry -- anything kamal can log
#                      into), e.g. ghcr.io/your-name
#   DEPLOY_DB_PORT     which port on the server postgres is published on,
#                      bound to localhost. 5433 if 5432 is already taken.
#
# Export them, or put them in .kamal/secrets.local, which is not in git. The
# hooks in .kamal/hooks check what tends to go wrong; README.md has the
# one-time steps (the DNS record, the secrets, loading the data).
service: carscraper
image: carscraper

ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "deployer") %>

servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST", "your.server.example.com") %>

  # The worker that runs the scrape, twice a day. GOOD_JOB_ENABLE_CRON is set
  # here and nowhere else, so this is the only container that schedules
  # anything -- see config/initializers/good_job.rb.
  job:
    cmd: bundle exec good_job start
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST", "your.server.example.com") %>
    env:
      clear:
        GOOD_JOB_ENABLE_CRON: 1

# How long kamal waits for a new container to answer. Its own default is 30s
# and that is not always enough: a deploy is the one moment two copies of this
# app are up at once -- the new one booting beside the old one still serving --
# and on a small server with no swap that boot crawls. Puma reached "Listening
# on 0.0.0.0:3000" a few seconds after the proxy had given up on it.
#
# Nothing is broken when that happens: the old container keeps the site, and
# kamal refuses to send traffic to one that never answered. But the deploy
# fails, and it fails more often the fuller the box gets. More patience here is
# the cheap half of the fix; the other half is `free -m` on the server.
deploy_timeout: 90

# kamal-proxy terminates TLS with a Let's Encrypt certificate, which it can
# only get once DEPLOY_DOMAIN resolves to the server above. Thruster listens
# on 80 inside the container.
proxy:
  ssl: true
  host: <%= ENV.fetch("DEPLOY_DOMAIN", "carscraper.example.com") %>
  app_port: 80

registry:
  server: <%= ENV.fetch("DEPLOY_REGISTRY", "ghcr.io/your-name") %>
  username: KAMAL_REGISTRY_USER
  password:
    - KAMAL_REGISTRY_PASSWORD

# Most rented servers are x86 and most laptops are no longer, so the build is
# emulated and slow. If that starts to hurt, build on the server instead:
#   builder:
#     remote: ssh://deployer@your.server.example.com
builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
    # Thruster serves public/ itself, but Rails is the fallback for anything
    # it hands through.
    RAILS_SERVE_STATIC_FILES: 1
    # The accessory below, by the name docker gives its container.
    DATABASE_HOST: carscraper-postgres
    DATABASE_PORT: 5432
    DATABASE_USER: carscraper
  secret:
    - SECRET_KEY_BASE
    - CARSCRAPER_DATABASE_PASSWORD
    # Unset, nothing is locked. Set, every click needs it -- see
    # ApplicationController.
    - CARSCRAPER_PASSWORD
    # Not a secret in any real sense: it is a point on a map. It is here rather
    # than in env/clear because a repository is a public place and where you
    # live is nobody's business.
    - HOME_LATITUDE
    - HOME_LONGITUDE

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse bash
  logs: app logs -f
  worker: app logs -f --roles=job
  psql: accessory exec postgres --interactive --reuse "psql -U carscraper carscraper_production"
  # One round by hand, on the server, in between the scheduled two.
  scrape: app exec --roles=job "bin/rails cars:scrape"
  # Find the duplicates again without asking the sites anything.
  tidy: app exec --roles=job "bin/rails cars:tidy"

# Lets a deploy hand the previous version's fingerprinted assets to the new
# one, so a page loaded a second before the switch keeps working.
asset_path: /rails/public/assets

# Our own copies of the listing photographs -- roughly 4 MB for six hundred
# cars -- which have to outlive a deploy. A named volume rather than a path on
# the host, so docker copies the directory's owner out of the image and the
# rails user can write to it. Both roles mount it: the job writes, the web
# serves.
volumes:
  - "carscraper-photos:/rails/public/photos"

accessories:
  postgres:
    image: postgres:18-alpine
    host: <%= ENV.fetch("DEPLOY_HOST", "your.server.example.com") %>
    # Bound to localhost, so the database is reachable from the server itself
    # and through an ssh tunnel, and from nowhere else. Set DEPLOY_DB_PORT if
    # 5432 on that machine already belongs to something.
    port: "127.0.0.1:<%= ENV.fetch("DEPLOY_DB_PORT", "5432") %>:5432"
    env:
      clear:
        POSTGRES_USER: carscraper
        POSTGRES_DB: carscraper_production
        # Pinned rather than left to the image: postgres 18 moved its default
        # data directory, and a data directory that moves is a data directory
        # you lose.
        PGDATA: /var/lib/postgresql/data
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
