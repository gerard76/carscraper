[tools]
ruby = "4.0.2"
# node and yarn are only here to refresh the echarts build that is checked into
# app/assets/builds; the app itself has no JS toolchain.
node = "24.18.1"
yarn = "1.22.19"

[tasks.server]
description = 'Run the rails server on port 3012'
run = 'PORT=3012 bundle exec rails server'

[tasks.development]
description = 'Run the full development stack like a foreman process'
run = [{ tasks = ["server"] }]

## CREDENTIALS

[tasks.edcred]
description = "Edit the Rails credentials"
# Every secret this project has is in config/credentials.yml.enc, opened by
# config/master.key, which sits next to it and is not in git.
run = 'EDITOR="${EDITOR:-vi}" bundle exec rails credentials:edit'

## SCRAPING

[tasks."scrape:production"]
description = "Scrape from here into the database on the droplet"
shell = "bash -euo pipefail -c"
# The scraping stays on this machine on purpose: the sites are friendlier to a
# home address than to a data centre. Only the result travels, through an ssh
# tunnel to the accessory, which listens on 5433 there because 5432 is
# trading-bot's.
#
# Without this, the site empties itself out: Car.on_offer only counts a car
# that has been seen in the last three days.
run = """
# Asking postgres rather than the socket. `nc -z` only proves something has
# 5433 open here, and an ssh whose far end has died still holds it -- which is
# how a run once sailed past this check and got "connection refused" from
# postgres a moment later, with nothing in the output to say the tunnel had
# never been opened.
if ! pg_isready -h localhost -p 5433 -q 2>/dev/null; then
  echo "Opening the tunnel to the droplet..."

  # ExitOnForwardFailure, or ssh goes to the background perfectly happily when
  # a stale tunnel still holds the port, returns 0, and the scrape falls over
  # later for a reason that looks like the database is down.
  if ! ssh -o ExitOnForwardFailure=yes -fN -L 5433:127.0.0.1:5433 deployer@146.185.130.81; then
    echo "✗ The tunnel would not open. If that says 'Address already in use', an older" >&2
    echo "  one is still holding the port: pkill -f 'ssh -fN -L 5433' and try again." >&2
    exit 1
  fi
fi

export DATABASE_URL="postgres://carscraper:$(.kamal/read-secret database.password)@localhost:5433/carscraper_production"
export RAILS_ENV=production

# This runs the code in THIS directory against the droplet's database, so a
# migration that has not been deployed yet is a crash halfway through a scrape
# -- "undefined method 'seats='", with a few hundred listings already written.
# Better to hear it before the first request.
bundle exec rails runner '
  context = ActiveRecord::Base.connection_pool.migration_context
  if context.needs_migration?
    ran = context.get_all_versions
    behind = context.migrations.reject { |m| ran.include?(m.version) }.map(&:name).join(", ")
    abort("The droplet is behind this checkout: #{behind} is not deployed there. bin/kamal deploy first.")
  end
'

bundle exec rails cars:scrape
"""
